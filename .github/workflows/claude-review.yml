name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰해줘. CLAUDE.md의 아키텍처·컨벤션·Gotchas를 기준으로 삼고,
            버그, 보안(인증/RLS/게스트 제한), 데이터 손실 위험을 우선으로 봐.
            구체적인 문제는 인라인 코멘트로, 전체 요약은 PR 코멘트 하나로 남겨줘.
            리뷰는 한국어로 작성해.

            모든 지적은 아래 기준으로 심각도를 분류해.
            - P0: 머지 차단. 보안 구멍, 데이터 손실, 운영 장애
            - P1: 머지 전 수정 권장. 실제로 재현되는 버그, CLAUDE.md 아키텍처·Gotchas 위반
            - P2: 선택 사항. 컨벤션, 가독성, 사소한 개선
            인라인 코멘트는 첫 줄을 [P0]처럼 등급으로 시작해.
            요약 코멘트는 맨 위에 등급별 개수를 적고, P0 → P1 → P2 순서로 묶어. 지적이 없는 등급은 "없음"으로 표시해.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
